version: "3"
services:
  postgres:
    image: library/postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    healthcheck:
      test: bash -c "pg_isready -U postgres -d postgres"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5436:5432"
    networks:
      - test-network

  person_service:
    image: person:latest
    container_name: person
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOCKER_CONNECTION_STRING: "Host=postgres;Port=5432;Database=persons;Username=program;Password=test"
    networks:
      - test-network
    command: ["sh", "-c", "/app/Person/linux-x86/Person.Web.Api"]
    ports:
      - "8080:8080"

volumes:
  db-data:

networks:
  test-network:
    driver: bridge